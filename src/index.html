<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#121212" />
		<meta name="color-scheme" content="dark" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="KrenzSketch" />
		<meta
			name="description"
			content="KrenzSketch is a standalone drawing PWA. Brush algorithms are based on Harmony by Mr.doob."
		/>
		<title>KrenzSketch</title>
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<link rel="stylesheet" href="./css/app.css" />
		<script>
			document.documentElement.classList.toggle(
				"compact-ui",
				window.matchMedia("(hover: none), (pointer: coarse), (max-width: 1024px), (max-height: 700px)").matches,
			);
		</script>
	</head>
	<body>
		<div class="app">
			<header class="toolbar">
				<div class="top-row">
					<h1 class="brand">KrenzSketch</h1>
					<a class="btn-about" href="./about.html">About</a>
					<button
						id="menu-btn"
						type="button"
						aria-expanded="false"
						aria-controls="tool-panel"
					>
						Menu
					</button>
				</div>

				<div id="tool-panel" class="tool-panel">
					<div class="group group-mode">
						<select id="mode" aria-label="Brush"></select>
						<button id="eraser" type="button" aria-pressed="false">Eraser</button>
					</div>

					<div class="group group-color">
						<label class="field" for="ink">Color</label>
						<span class="swatch">
							<input id="ink" type="color" value="#1c1c1c" aria-label="Drawing color" />
						</span>
						<label class="field" for="paper">Paper</label>
						<span class="swatch">
							<input id="paper" type="color" value="#ece8e1" aria-label="Paper color" />
						</span>
					</div>

					<div class="group group-size">
						<label class="field" for="size">Size</label>
						<input id="size" class="size" type="range" min="1" max="12" step="0.5" value="1.5" />
						<span id="size-value" class="size-value">1.5</span>
					</div>

					<div class="group group-actions">
						<button id="undo" type="button" title="Undo">Undo</button>
						<button id="redo" type="button" title="Redo">Redo</button>
						<button id="clear" class="danger" type="button">Clear</button>
						<button id="export" type="button">PNG</button>
						<button id="share" type="button" hidden>Share</button>
					</div>

					<nav class="tool-legal" aria-label="Legal">
						<a href="./about.html">About</a>
						<a href="./about.html#impressum">Impressum</a>
						<a href="./about.html#datenschutz">Datenschutz</a>
					</nav>
				</div>
			</header>

			<main class="stage" id="stage">
				<canvas id="canvas" aria-label="Drawing canvas"></canvas>
			</main>
		</div>

		<dialog id="menu-dialog">
			<div class="sheet">
				<h2>KrenzSketch</h2>
				<p>
					Standalone drawing app. No cloud storage, no trackers.
				</p>
				<nav aria-label="Further pages">
					<a href="./about.html">About</a>
					<a href="./about.html#impressum">Impressum</a>
					<a href="./about.html#datenschutz">Datenschutz</a>
				</nav>
				<menu>
					<button type="button" onclick="this.closest('dialog').close()">Close</button>
				</menu>
			</div>
		</dialog>

		<dialog id="confirm-dialog">
			<div class="sheet">
				<h2>Clear current drawing?</h2>
				<p>This permanently removes the current drawing from this device.</p>
				<menu>
					<button type="button" onclick="this.closest('dialog').close()">Cancel</button>
					<button id="confirm-ok" class="danger" type="button">Clear</button>
				</menu>
			</div>
		</dialog>

		<div id="update-banner" class="update-banner" hidden>
			<span>Update available</span>
			<button id="update-now" type="button">Update</button>
			<button id="update-later" type="button">Later</button>
		</div>

		<script type="module" src="./js/app.js"></script>
	</body>
</html>
