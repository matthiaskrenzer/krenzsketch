<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#121212" />
		<meta name="color-scheme" content="dark" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="KrenzSketch" />
		<meta
			name="description"
			content="KrenzSketch ist eine eigenständige Zeichen-PWA. Die Zeichenalgorithmen basieren auf Harmony von Mr.doob."
		/>
		<title>KrenzSketch</title>
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<link rel="stylesheet" href="./css/app.css" />
	</head>
	<body>
		<div class="app">
			<header class="toolbar">
				<div class="top-row">
					<h1 class="brand">KrenzSketch</h1>
					<button id="menu-btn" type="button" aria-haspopup="dialog">Menü</button>
				</div>

				<div class="group group-mode">
					<label class="field" for="mode">Modus</label>
					<select id="mode" aria-label="Zeichenmodus"></select>
				</div>

				<div class="group group-color">
					<label class="field" for="ink">Farbe</label>
					<span class="swatch">
						<input id="ink" type="color" value="#1c1c1c" aria-label="Stiftfarbe" />
					</span>
					<label class="field" for="paper">Papier</label>
					<span class="swatch">
						<input id="paper" type="color" value="#ece8e1" aria-label="Hintergrundfarbe" />
					</span>
				</div>

				<div class="group group-size">
					<label class="field" for="size">Stärke</label>
					<input id="size" class="size" type="range" min="1" max="12" step="0.5" value="1.5" />
					<span id="size-value" class="size-value">1,5</span>
				</div>

				<div class="group group-actions">
					<button id="undo" type="button" title="Rückgängig">Zurück</button>
					<button id="redo" type="button" title="Wiederholen">Vor</button>
					<button id="clear" class="danger" type="button">Löschen</button>
					<button id="export" type="button">PNG</button>
				</div>
			</header>

			<main class="stage">
				<canvas id="canvas" aria-label="Zeichenfläche"></canvas>
			</main>
		</div>

		<dialog id="menu-dialog">
			<div class="sheet">
				<h2>KrenzSketch</h2>
				<p>
					Eigenständige Zeichenanwendung. Keine Cloud-Speicherung, keine Tracker.
				</p>
				<nav aria-label="Weitere Seiten">
					<a href="./credits.html">Credits / Open Source</a>
					<a href="./impressum.html">Impressum</a>
					<a href="./datenschutz.html">Datenschutz</a>
				</nav>
				<menu>
					<button type="button" onclick="this.closest('dialog').close()">Schließen</button>
				</menu>
			</div>
		</dialog>

		<dialog id="confirm-dialog">
			<div class="sheet">
				<h2>Zeichenfläche löschen?</h2>
				<p>Die aktuelle Zeichnung wird entfernt. Über Rückgängig kann der letzte Stand wiederhergestellt werden.</p>
				<menu>
					<button type="button" onclick="this.closest('dialog').close()">Abbrechen</button>
					<button id="confirm-ok" class="danger" type="button">Löschen</button>
				</menu>
			</div>
		</dialog>

		<script type="module" src="./js/app.js"></script>
	</body>
</html>
